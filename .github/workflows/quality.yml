name: OpenDesign quality

on:
  pull_request:
  push:
    branches:
      - main
      - "maintenance/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install "jsonschema>=4.23,<5"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Compile Python and validate shell
        run: |
          python -m py_compile scripts/build.py scripts/healthcheck.py scripts/check-public-contract.py scripts/auto-evaluate.py
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python scripts/auto-evaluate.py --fixture scripts/fixtures/daily-curation-sample.json --limit 1
          bash -n scripts/smoke.sh

      - name: Validate Studio and Admin workspaces
        run: |
          cd studio
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build

      - name: Guard the known PPTX image parser input surface
        run: |
          test -f docs/security/pptx-image-advisory.md
          git grep -q 'validatePptxAsset' -- studio/packages/renderers/src/pptx.ts
          git grep -q 'content must match' -- studio/packages/renderers/src/renderers.test.ts

      - name: Report dependency advisories
        continue-on-error: true
        run: |
          cd studio
          npm audit --audit-level=high

      - name: Check public facts and interfaces
        run: python scripts/check-public-contract.py

      - name: Run offline release gate
        run: bash scripts/smoke.sh

      - name: Reject credential-shaped strings
        shell: bash
        run: |
          if git grep -nE 'ghp_[[:alnum:]]{30,}|AKID[[:alnum:]]{20,}' -- .; then
            echo "Credential-shaped string found in tracked files."
            exit 1
          fi

  public-readonly:
    name: Public read-only health
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check public production endpoints without writes
        run: python scripts/healthcheck.py --quiet
